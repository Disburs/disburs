name: CI

# Frontend CI: type-check + build, then the Playwright e2e suite, on every PR
# and on pushes to main. The suite mocks the backend, so no API is needed.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    name: Build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` type-checks and fails on type errors, so this doubles as
      # our compile check (ESLint runs in the Lint step above, not here). Note
      # NEXT_PUBLIC_API_URL is inlined at build time; pin it to the app origin so
      # the mocked waitlist call is same-origin under e2e.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
